<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Shield Outline & High-Contrast Backdrop -->
  <path d="M16 2.5L5.5 6.8V14.5c0 7.2 4.5 13.8 10.5 15.8 6-2 10.5-8.6 10.5-15.8V6.8L16 2.5z" 
        fill="#090d16" 
        stroke="#3b82f6" 
        stroke-width="1.8" 
        stroke-linejoin="round" />
  
  <!-- Inner White Shield Contour -->
  <path d="M16 4.8L7.5 8.2V14.5c0 5.8 3.6 11.2 8.5 13 4.9-1.8 8.5-7.2 8.5-13V8.2L16 4.8z" 
        fill="#0f172a" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        stroke-opacity="0.6" 
        stroke-linejoin="round" />

  <!-- Crossed Swords (Pure Crisp White) -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sword 1 (Top-Left to Bottom-Right) -->
    <line x1="10" y1="10" x2="22" y2="22" />
    <line x1="9.5" y1="13.5" x2="13.5" y2="9.5" />
    <circle cx="8.5" cy="8.5" r="1.1" fill="#ffffff" stroke="none" />

    <!-- Sword 2 (Top-Right to Bottom-Left) -->
    <line x1="22" y1="10" x2="10" y2="22" />
    <line x1="18.5" y1="9.5" x2="22.5" y2="13.5" />
    <circle cx="23.5" cy="8.5" r="1.1" fill="#ffffff" stroke="none" />
  </g>

  <!-- Center Core Defense Emblem -->
  <polygon points="16,13.2 17.8,16 16,18.8 14.2,16" fill="#ffffff" />
  <circle cx="16" cy="16" r="0.8" fill="#0f172a" />
</svg>
