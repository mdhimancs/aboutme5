<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Dark Indigo Executive Background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#1e1b4b"/>
  <!-- Crisp Sharp Inner Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.9"/>
  <!-- Ultra-Sharp High-Contrast MD Text (Vertically elongated by 5%) -->
  <text x="16" y="13.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', 'SF Pro Display', sans-serif" font-weight="900" font-size="15.5" letter-spacing="-0.3" fill="#ffffff" transform="translate(16, 13.2) scale(1, 1.05) translate(-16, -13.2)">MD</text>
  <!-- 1-Point Thicker Sky-Blue Accent Underline -->
  <line x1="5" y1="23.5" x2="27" y2="23.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
</svg>
