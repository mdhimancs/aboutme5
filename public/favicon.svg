<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- High-Tech Executive Sapphire to Electric Cyan Gradient -->
    <linearGradient id="tileGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="42%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>

    <!-- Glowing Cyber Perimeter Rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Shield Face Left Facet (Light Azure) -->
    <linearGradient id="facetLeft" x1="7" y1="6" x2="16" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Shield Face Right Facet (Deep Sapphire) -->
    <linearGradient id="facetRight" x1="16" y1="6" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Top Specular Glass Reflection -->
    <linearGradient id="glassTop" x1="16" y1="2" x2="16" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Crisp Squircle Tile Base: Unmatched Clarity & Punch on Dark and Light Browser Tabs -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#tileGrad)" stroke="url(#rimGrad)" stroke-width="1.6"/>

  <!-- Top Glass Highlight -->
  <path d="M2 8 C2 4.2 4.2 2 8 2 L24 2 C27.8 2 30 4.2 30 8 L30 13 C22 16 11 15 2 10.5 Z" fill="url(#glassTop)"/>

  <!-- Left Facet of Cybersecurity Shield -->
  <path d="M16 6 L8.5 9.5 C8.5 16 11.5 21.5 16 25 Z" fill="url(#facetLeft)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Right Facet of Cybersecurity Shield -->
  <path d="M16 6 L23.5 9.5 C23.5 16 20.5 21.5 16 25 Z" fill="url(#facetRight)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Center Metallic Crest Ridge -->
  <line x1="16" y1="6" x2="16" y2="25" stroke="#ffffff" stroke-width="0.8" opacity="0.85"/>

  <!-- Razor-Sharp Pure White Verified Zero-Trust Checkmark -->
  <path d="M11.6 15.6 L14.8 18.8 L20.6 12.2" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Radiant Cyan Cyber Beacon in Lower Right Corner -->
  <circle cx="24" cy="24" r="2.3" fill="#22d3ee" stroke="#0a1224" stroke-width="1.2"/>
  <circle cx="24" cy="24" r="1.1" fill="#ffffff"/>
</svg>
