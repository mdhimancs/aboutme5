<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Silver Metallic Gradient for Underline and Accent Dot -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="silverDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Dark Indigo/Obsidian Executive Background -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Crisp Sharp Inner Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#334155" stroke-width="1" opacity="0.85"/>
  <!-- High-Contrast Letter M -->
  <text x="13.5" y="13.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Helvetica Neue', 'SF Pro Display', sans-serif" font-weight="900" font-size="15.5" letter-spacing="-0.2" fill="#ffffff">M</text>
  <!-- Refined Silver Accent Dot -->
  <circle cx="23.8" cy="17.2" r="1.9" fill="url(#silverDotGrad)"/>
  <!-- Sleek Silver Accent Underline -->
  <line x1="5" y1="23.5" x2="27" y2="23.5" stroke="url(#silverGradient)" stroke-width="2.6" stroke-linecap="round"/>
</svg>
