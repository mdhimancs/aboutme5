    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Static Branch Fallback for GitHub Pages ("Deploy from a branch" root mode):
      // When served via Vite Dev Server, /@vite/client is injected.
      // When built via Vite into dist/index.html, script[src="/src/main.tsx"] is replaced with ./assets/index-*.js.
      // When GitHub Pages serves the raw root index.html from the main branch, neither happens and raw .tsx cannot execute in a browser.
      // This fallback automatically mounts the pre-compiled production bundle from ./dist/standalone.js.
      (function () {
        var isViteDev = !!document.querySelector('script[src*="/@vite/client"]');
        var hasRawTsxEntry = !!document.querySelector('script[src="/src/main.tsx"]');
        if (!isViteDev && hasRawTsxEntry) {
          var cssLink = document.createElement('link');
          cssLink.rel = 'stylesheet';
          cssLink.href = './dist/standalone.css';
          document.head.appendChild(cssLink);

          var jsScript = document.createElement('script');
          jsScript.type = 'module';
          jsScript.src = './dist/standalone.js';
          document.body.appendChild(jsScript);
        }
      })();
    </script>
